<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcify</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="title"><h1>Calcify</h1></div>
    <div id="main">
        <div class="border">
            <input class="screen itemScreen" id="screen" type="text" readonly>
            <div class="buttons">
                <button class="nums itemAC"  data-type="action" data-action="clear">AC</button>
                <button class="nums itemB"   data-type="action" data-action="backspace">⌫</button>
                <button class="nums itemDivide" data-type="operator" data-op="/">÷</button>
                <button class="nums itemTimes"  data-type="operator" data-op="*">×</button>
                <button class="nums item7"   data-type="digit" data-digit="7">7</button>
                <button class="nums item8"   data-type="digit" data-digit="8">8</button>
                <button class="nums item9"   data-type="digit" data-digit="9">9</button>
                <button class="nums item4"   data-type="digit" data-digit="4">4</button>
                <button class="nums item5"   data-type="digit" data-digit="5">5</button>
                <button class="nums item6"   data-type="digit" data-digit="6">6</button>
                <button class="nums itemMinus" data-type="operator" data-op="-">−</button>
                <button class="nums item1"   data-type="digit" data-digit="1">1</button>
                <button class="nums item2"   data-type="digit" data-digit="2">2</button>
                <button class="nums item3"   data-type="digit" data-digit="3">3</button>
                <button class="nums itemPlus"  data-type="operator" data-op="+">+</button>
                <button class="nums item0"   data-type="digit" data-digit="0">0</button>
                <button class="nums itemDot"  data-type="digit" data-digit=".">.</button>
                <button id="equals" class="nums itemEquals" data-type="action" data-action="equals">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
